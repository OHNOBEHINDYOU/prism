<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Audio Visualiser</title>
<meta name="theme-color" content="#17181a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prism">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@font-face{font-family:"Michroma";src:url("fonts/michroma.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Share Tech Mono";src:url("fonts/share-tech-mono.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* Layout idea: a hi-fi separate. Smoked lid strip on top, a CRT screen with graticule in the middle, a brushed-aluminium faceplate of push keys and faders below. Single theme by choice. */
:root{
  color-scheme:dark;
  --case:#17181a;
  --alu:#c5c8ca;
  --alu-hi:#eef0f1;
  --alu-lo:#868a8d;
  --ink:#1c1e20;
  --crt:#030a06;
  --phos:#6dffa0;
  --amber:#ffb238;
  --label:"Michroma",ui-sans-serif,system-ui,sans-serif;
  --read:"Share Tech Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--case);color:var(--ink);font-family:var(--label);font-size:10px;overflow:hidden;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

/* lid strip */
header{flex:none;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 16px 10px;background:linear-gradient(180deg,#2b2d30,#1a1b1d);border-bottom:2px solid var(--alu-lo);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.brand{display:flex;flex-direction:column;gap:5px;min-width:0}
h1{font:400 19px/1 var(--label);letter-spacing:.34em;text-transform:uppercase;margin:0;color:var(--alu-hi)}
.brand span{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--alu-lo)}
.disc{cursor:pointer;-webkit-tap-highlight-color:transparent;width:46px;height:46px;border-radius:50%;outline:3px dotted #8e9295;outline-offset:2px;margin:5px;
  background:
    radial-gradient(circle,#d9dadb 0 5%,#d9522b 6% 31%,#0c0c0c 32% 34%,transparent 35%),
    repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),
    conic-gradient(from 20deg,#0e0e0e,#444 8%,#0e0e0e 16%,#0e0e0e 50%,#444 58%,#0e0e0e 66%,#0e0e0e);
  animation:spin 1.8s linear infinite;animation-play-state:paused}
body.live .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.readout{display:flex;gap:12px;align-items:baseline;grid-column:1/-1;margin:0;padding:8px 10px;font:400 14px/1.3 var(--read);letter-spacing:.04em;text-transform:uppercase;color:var(--phos);background:#060d09;border-radius:3px;box-shadow:inset 0 2px 6px #000,0 1px 0 rgba(255,255,255,.1);text-shadow:0 0 8px rgba(109,255,160,.55);overflow-wrap:anywhere}

/* CRT */
#screen{flex:1 0 130px;position:relative;margin:14px 16px;border-radius:20px;overflow:hidden;background:var(--crt);box-shadow:0 0 0 2px #060707,0 0 0 9px #2d2f31,0 0 0 10px #5a5d60}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#grat{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(170,255,200,.22),rgba(170,255,200,.22)) 50% 0/1px 100% no-repeat,
    linear-gradient(rgba(170,255,200,.22),rgba(170,255,200,.22)) 0 50%/100% 1px no-repeat,
    repeating-linear-gradient(90deg,rgba(170,255,200,.09) 0 1px,transparent 1px 10%),
    repeating-linear-gradient(0deg,rgba(170,255,200,.09) 0 1px,transparent 1px 12.5%)}
body.nogrid #grat{background:none}
#grat::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 46px 10px rgba(0,0,0,.85);background:linear-gradient(155deg,rgba(255,255,255,.07),transparent 32%)}
body.quiet header,body.quiet .panel{display:none}
body.quiet #screen{margin:0;border-radius:0;box-shadow:none}

/* faceplate */
.panel{flex:0 1 auto;min-height:0;max-height:48%;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:11px;border-top:1px solid #f6f7f7;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 3px),linear-gradient(180deg,#dcdfe0,#b4b8ba)}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:7.5px;letter-spacing:.24em;text-transform:uppercase;color:#3d4144;display:flex;align-items:center;gap:8px}
.lbl::after{content:"";flex:1;height:1px;background:rgba(0,0,0,.28);box-shadow:0 1px 0 rgba(255,255,255,.6)}
.keys{display:flex;gap:7px;flex-wrap:wrap}
.keys.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 1px 4px}
.keys.scroll::-webkit-scrollbar{display:none}
#cw{position:static;inset:auto;flex:none;width:112px;height:112px;border-radius:50%;touch-action:none;cursor:crosshair;box-shadow:0 0 0 2px #2a2d2f,0 2px 6px rgba(0,0,0,.5)}
#cwRow{align-items:flex-start;margin-top:6px}
.cwside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
/* computers and laptops: a scroll bar under each row of keys that runs off the edge */
.sbar{display:none;position:relative;height:9px;margin:1px 1px 3px;border-radius:5px;background:rgba(0,0,0,.3);box-shadow:inset 0 1px 2px rgba(0,0,0,.55);cursor:pointer;touch-action:none}
.sbar i{position:absolute;top:1px;bottom:1px;min-width:24px;border-radius:4px;background:linear-gradient(#d4d7d9,#8d9295);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.sbar i:hover,.sbar.drag i{background:linear-gradient(#f0f2f3,#a9aeb1)}
@media (hover:hover) and (pointer:fine){ .sbar.on{display:block} }
button{font:400 9px/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);flex:none;white-space:nowrap;cursor:pointer;
  display:inline-flex;flex-direction:column;align-items:center;gap:7px;min-width:58px;padding:7px 11px 10px;border-radius:3px;border:1px solid #6d7174;
  background:linear-gradient(180deg,#f7f8f8,#cfd2d4 55%,#bfc3c5);box-shadow:0 3px 0 #74787b,0 4px 5px rgba(0,0,0,.35),inset 0 1px 0 #fff;transition:transform .05s,box-shadow .05s}
button::before{content:"";width:16px;height:3px;border-radius:1px;background:#575b5e;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
button:active,button[aria-pressed="true"]{transform:translateY(2px);box-shadow:0 1px 0 #74787b,0 1px 2px rgba(0,0,0,.35),inset 0 1px 3px rgba(0,0,0,.25);background:linear-gradient(180deg,#d9dcde,#c2c6c8)}
button[aria-pressed="true"]::before{background:var(--amber);box-shadow:0 0 7px 1px rgba(255,160,30,.9)}
button:focus-visible{outline:2px solid #d9522b;outline-offset:2px}
#pals button::before{display:none}
.sw{width:26px;height:6px;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}

.fad{flex-wrap:nowrap;align-items:center;gap:14px}
.fader{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:36px;margin:0;cursor:pointer;background:linear-gradient(90deg,#4a4f52 0 2px,transparent 2px) 11px 100%/calc((100% - 24px)/var(--stops,10)) 6px repeat-x}
.fader::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#2a2d2f;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.65)}
.fader::-moz-range-track{height:8px;border-radius:4px;background:#2a2d2f;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.65)}
.fader::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:36px;margin-top:-14px;border-radius:3px;border:1px solid #6d7174;background:linear-gradient(90deg,#f7f8f8 0 42%,#d9522b 42% 58%,#e4e6e7 58%);box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.fader::-moz-range-thumb{width:24px;height:36px;border-radius:3px;border:1px solid #6d7174;background:linear-gradient(90deg,#f7f8f8 0 42%,#d9522b 42% 58%,#e4e6e7 58%);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.fader:focus-visible{outline:2px solid #d9522b;outline-offset:2px}
.fad .lbl{flex:none}
.fad .lbl::after{display:none}
#file,#picFile,#mdlFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#now{flex:1;min-width:0}
#bpm{flex:none;white-space:nowrap}
.sel{flex:1;min-width:0;height:34px;padding:0 10px;font:400 13px/1 var(--read);text-transform:uppercase;letter-spacing:.04em;color:var(--phos);background:#060d09;border:1px solid #6d7174;border-radius:3px;box-shadow:inset 0 2px 6px #000;-webkit-appearance:none;appearance:none}
.sel:focus-visible{outline:2px solid #d9522b;outline-offset:2px}
.grp .keys+.keys{margin-top:2px}
.fold{flex-direction:row;align-items:center;gap:8px;width:100%;min-width:0;padding:7px 0;border:0;border-radius:0;background:none;box-shadow:none;font-size:7.5px;letter-spacing:.24em;color:#3d4144;text-align:left;transform:none!important}
.fold:active{background:none;box-shadow:none}
.fold::before{content:"+";width:12px;height:auto;background:none;box-shadow:none;font:400 13px/1 var(--read);text-align:center}
.fold[aria-expanded="true"]::before{content:"-"}
.fold::after{content:"";flex:1;height:1px;background:rgba(0,0,0,.28);box-shadow:0 1px 0 rgba(255,255,255,.6)}
.foldbody{display:flex;flex-direction:column;gap:8px}
#tip{position:fixed;z-index:60;left:8px;top:8px;max-width:min(290px,86vw);padding:11px 13px;font:400 14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0;text-transform:none;color:#f4f4f6;background:#0f1012;border:1px solid #7a7e81;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.65);pointer-events:none}
#spId{text-transform:none;letter-spacing:0;font-size:16px}
#spMsg{margin:6px 0 0;font:400 12px/1.45 var(--read);color:#3d4144;-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
#spMsg:empty{display:none}
#msg{margin:0;padding:8px 10px;font:400 13px/1.45 var(--read);color:var(--amber);background:#100c06;border-radius:3px;box-shadow:inset 0 2px 6px #000;-webkit-user-select:text;user-select:text}
#msg:empty{display:none}
#pip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#pipfeed{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
body.pipfix #c{object-fit:contain}
body:not([data-style="retro"]) #grat{background:none}
body[data-style="modern"] #screen{margin:0;border-radius:0;box-shadow:none;background:#05050b}
body[data-style="modern"] #grat::after,body[data-style="led"] #grat::after,body[data-style="vinyl"] #grat::after,body[data-style="print"] #grat::after{display:none}
body[data-style="meter"] #screen{border-radius:9px;background:#141516;box-shadow:0 0 0 2px #060707,0 0 0 8px #2d2f31,0 0 0 9px #5a5d60}
body[data-style="meter"] #grat::after{box-shadow:inset 0 0 34px rgba(40,20,0,.4)}
body[data-style="vfd"] #screen{border-radius:7px;background:#020807;box-shadow:0 0 0 2px #000,0 0 0 8px #1c1e20,0 0 0 9px #4c4f52}
body[data-style="vfd"] #grat{background:repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
body[data-style="vfd"] #grat::after{box-shadow:inset 0 0 30px 6px rgba(0,0,0,.8)}
body[data-style="led"] #screen{border-radius:4px;background:#060303;box-shadow:0 0 0 2px #000,0 0 0 7px #232526,0 0 0 8px #4c4f52}
body[data-style="vinyl"] #screen{border-radius:12px;background:#c9cccd;box-shadow:0 0 0 1px #f4f5f5,0 0 0 3px #6f7376,0 6px 16px rgba(0,0,0,.6)}
body[data-style="console"] #screen{border-radius:30px;background:#000;box-shadow:0 0 0 3px #050505,0 0 0 13px #3a3b3d,0 0 0 14px #62656a}
body[data-style="console"] #grat{background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
body[data-style="print"] #screen{border-radius:2px;background:#f1ead9;box-shadow:0 3px 14px rgba(0,0,0,.6)}
body[data-style="vector"] #screen{background:#000}
body.quiet #screen{margin:0!important;border-radius:0!important;box-shadow:none!important}
#screen{touch-action:none;-webkit-touch-callout:none}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:88%;margin:0;padding:8px 12px;text-align:center;font:400 13px/1.35 var(--read);text-transform:uppercase;letter-spacing:.04em;color:var(--phos);background:rgba(4,10,7,.88);border-radius:3px;box-shadow:0 0 0 1px rgba(109,255,160,.3);opacity:0;transition:opacity .3s;pointer-events:none}
#hint.on{opacity:1}
/* wide or short-and-wide windows: the screen takes the left, the controls a column on the right */
@media (orientation:landscape) and (max-height:560px), (min-width:900px){
  body{display:grid;grid-template-columns:1fr minmax(300px,min(44%,430px));grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:2;grid-row:1;padding:8px 14px}
  #screen{grid-column:1;grid-row:1/3;margin:12px}
  .panel{grid-column:2;grid-row:2;max-height:none;padding:10px 14px 14px}
  body.quiet{display:flex}
}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Prism</h1>
    <span>Direct drive audio visualiser</span>
  </div>
  <div class="disc" id="disc" aria-hidden="true"></div>
  <p class="readout"><span id="now">Pick a sound source below to begin</span><span id="bpm"></span></p>
</header>
<div id="screen">
  <video id="pip" muted playsinline webkit-playsinline autoplay aria-hidden="true"></video>
  <canvas id="c" aria-label="Audio visualisation"></canvas>
  <div id="grat" aria-hidden="true"></div>
  <p id="hint" role="status"></p>
</div>
<section class="panel" aria-label="Controls">
  <div class="grp">
    <span class="lbl">Input</span>
    <div class="keys">
      <button id="bMic" type="button">Mic</button>
      <button id="bFile" type="button">Files</button>
      <input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus,.aif,.aiff,.caf,.mp4" multiple tabindex="-1" aria-hidden="true">
      <button id="bDemo" type="button">Demo</button>
      <button id="bTab" type="button">Tab audio</button>
    </div>
  </div>
  <div class="grp" id="transport" hidden>
    <span class="lbl">Transport</span>
    <div class="keys">
      <button id="bPlay" type="button">Pause</button>
      <button id="bNext" type="button">Next</button>
      <button id="bPrev" type="button">Previous</button>
    </div>
  </div>
  <div class="grp" id="demoGrp" hidden>
    <span class="lbl">Demo beat</span>
    <div class="keys">
      <button id="bDemoNext" type="button">Next beat</button>
      <button id="bDemoPrev" type="button">Previous beat</button>
    </div>
  </div>
  <div class="grp" id="micGrp" hidden>
    <span class="lbl">Microphone and line in</span>
    <div class="keys fad">
      <span class="lbl">Source</span>
      <select id="micDev" class="sel" aria-label="Input source"><option value="">Default input</option></select>
    </div>
    <div class="keys fad">
      <span class="lbl">Low</span>
      <input type="range" class="fader" id="micSens" min="-2" max="3" step="0.5" value="0" style="--stops:10" aria-label="Microphone sensitivity">
      <span class="lbl">High</span>
      <button id="bMicAuto" type="button" aria-pressed="true">Auto level</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">Screen style</span>
    <div class="keys scroll" id="styles"></div>
  </div>
  <div class="grp">
    <span class="lbl">Display mode</span>
    <div class="keys scroll" id="modes"></div>
  </div>
  <div class="grp" id="optGrp" hidden>
    <span class="lbl">Mode options</span>
    <div class="keys">
      <button id="bSmooth" type="button" aria-pressed="false" hidden>Smooth lines</button>
      <button id="bPic" type="button" hidden>Choose picture</button>
      <button id="bPicReset" type="button" hidden>Reset picture</button>
      <button id="bMdl" type="button" hidden>Choose model</button>
      <button id="bMdlReset" type="button" hidden>Reset model</button>
    </div>
    <input type="file" id="picFile" accept="image/*" tabindex="-1" aria-hidden="true">
    <input type="file" id="mdlFile" accept=".glb,model/gltf-binary,application/octet-stream" tabindex="-1" aria-hidden="true">
  </div>
  <div class="grp" id="palGrp">
    <span class="lbl">Trace colour</span>
    <div class="keys scroll" id="pals"></div>
    <div class="keys fad" id="cwRow" hidden>
      <canvas id="cw" width="240" height="240" tabindex="0" role="slider" aria-label="Colour wheel: drag to choose a colour"></canvas>
      <div class="cwside">
        <div class="keys fad">
          <span class="lbl">Dark</span>
          <input type="range" class="fader" id="cwV" min="0.3" max="1" step="0.1" value="1" style="--stops:7" aria-label="Custom colour brightness">
          <span class="lbl">Bright</span>
        </div>
        <div class="keys" id="cwSch">
          <button type="button" data-k="one" aria-pressed="true">One colour</button>
          <button type="button" data-k="two" aria-pressed="false">Opposites</button>
          <button type="button" data-k="three" aria-pressed="false">Triad</button>
          <button type="button" data-k="near" aria-pressed="false">Neighbours</button>
        </div>
      </div>
    </div>
  </div>
  <div class="grp">
    <button type="button" class="fold" id="bFoldScreen" data-fold="screen" aria-expanded="true" aria-controls="screenBody">Screen</button>
    <div class="foldbody" id="screenBody">
    <div class="keys">
      <button id="bFull" type="button">Full screen</button>
      <button id="bAuto" type="button" aria-pressed="true">Auto</button>
      <button id="bLock" type="button">Lock</button>
      <button id="bPip" type="button" aria-pressed="false">Mini player</button>
      <button id="bRec" type="button" aria-pressed="false">Record clip</button>
      <button id="bRecDel" type="button" hidden>Discard clip</button>
      <button id="bGrid" type="button" aria-pressed="true">Graticule</button>
      <button id="bClicks" type="button" aria-pressed="true">Key clicks</button>
    </div>
    </div>
  </div>
  <div class="grp">
    <button type="button" class="fold" id="bFoldFav" data-fold="fav" aria-expanded="false" aria-controls="favBody">Favourites</button>
    <div class="foldbody" id="favBody" hidden>
      <div class="keys scroll" id="favs">
        <button id="bFavAdd" type="button">Save look</button>
        <button id="bFavDel" type="button" hidden>Remove</button>
      </div>
    </div>
  </div>
  <div class="grp" id="spGrp">
    <button type="button" class="fold" id="bFoldSp" data-fold="sp" aria-expanded="false" aria-controls="spBody">Spotify</button>
    <div class="foldbody" id="spBody" hidden>
      <div class="keys fad">
        <input type="text" id="spId" class="sel" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" placeholder="Paste your Client ID here" aria-label="Spotify Client ID">
      </div>
      <div class="keys">
        <button id="bSp" type="button" aria-pressed="false">Connect</button>
      </div>
      <p id="spMsg"></p>
    </div>
  </div>
  <div class="grp">
    <button type="button" class="fold" id="bFoldGain" data-fold="gain" aria-expanded="false" aria-controls="gainBody">Gain</button>
    <div class="foldbody" id="gainBody" hidden>
      <div class="keys fad">
        <span class="lbl">Low</span>
        <input type="range" class="fader" id="sens" min="0.4" max="3" step="0.2" value="1" style="--stops:13" aria-label="Gain">
        <span class="lbl">High</span>
      </div>
    </div>
  </div>
  <div class="grp" id="beatGrp">
    <button type="button" class="fold" id="bFold" data-fold="beat" aria-expanded="false" aria-controls="beatBody">Beat and auto change</button>
    <div class="foldbody" id="beatBody" hidden>
      <div class="keys">
        <button id="bAutoEvery" type="button">Every 32 beats</button>
        <button id="bAutoFrom" type="button" aria-pressed="false">From everything</button>
      </div>
      <div class="keys fad">
        <span class="lbl">Calm</span>
        <input type="range" class="fader" id="beatSens" min="-1" max="1" step="0.25" value="0" style="--stops:8" aria-label="Beat sensitivity">
        <span class="lbl">Eager</span>
      </div>
    </div>
  </div>
  <p id="msg" role="status"></p>
</section>
<div id="tip" role="tooltip" hidden></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const cv=$('c'), G=cv.getContext('2d');
let g=G;
let W=1,H=1,U=1,clearReq=true,rec=null,pipOn=false;
const PW=800, PH=600;
function resize(){
  /* cap the pixel count so large or high-density screens stay smooth */

const bandBuf={}, bandAvg={};
function bands(n){
  const out=bandBuf[n]||(bandBuf[n]=new Float32Array(n)), av=bandAvg[n]||(bandAvg[n]=new Float32Array(n));
  const nyq=sr/2, bins=freq.length, lo=Math.log(35), hi=Math.log(Math.min(15000,nyq));
  for(let i=0;i<n;i++){
    const f0=Math.exp(lo+(hi-lo)*i/n), f1=Math.exp(lo+(hi-lo)*(i+1)/n);
    const a=Math.floor(f0/nyq*bins), b=Math.max(a+1,Math.ceil(f1/nyq*bins));
    let s=0; for(let k=a;k<b&&k<bins;k++) if(freq[k]>s) s=freq[k];
    /* steady sound is held back and sudden rises are pushed up, so hits stand out from the bed */
    const v=clamp(s/255*(0.65+0.75*i/n)*gain);
    av[i]+=(v-av[i])*0.05;
    out[i]=clamp(0.62*Math.pow(v,1.6)+1.9*Math.max(0,v-av[i]));
  }
  return out;
}

let picOwn=false;
$('bMdl').onclick=()=>$('mdlFile').click();
$('mdlFile').onchange=e=>{

function loadPicture(url,keep){
  const im=new Image();
  im.onload=()=>{
    try{
      setPicture(im,im.naturalWidth||im.width,im.naturalHeight||im.height); picOwn=true; say('');
      if(keep){ try{ const k=document.createElement('canvas'); k.width=k.height=320; k.getContext('2d').drawImage(pic.c,0,0,320,320); localStorage.setItem('prism-pic',k.toDataURL('image/jpeg',0.82)); }catch(e){} }
    }catch(e){ say('That picture could not be used.'); }
    if(keep) URL.revokeObjectURL(url); modeUi();
  };
  im.onerror=()=>{ if(keep){ URL.revokeObjectURL(url); say('That picture could not be opened. JPEG and PNG pictures work best.'); } };
  im.src=url;
}
$('bPic').onclick=()=>$('picFile').click();
$('picFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) loadPicture(URL.createObjectURL(f),true); };
$('bPicReset').onclick=()=>{ pic=null; picOwn=false; try{ localStorage.removeItem('prism-pic'); }catch(e){} modeUi(); };

/* ---------- Spotify link: shows what is playing on your Spotify account. It cannot hear the music, so a sound source is still needed ---------- */
const SPOT={id:'',tok:'',ref:'',exp:0,title:'',img:null,imgUrl:'',dur:0,prog:0,at:0,playing:false,timer:null,shown:'',prev:''};
try{ const s0=JSON.parse(localStorage.getItem('prism-spotify')||'{}'); SPOT.id=String(s0.id||''); SPOT.tok=String(s0.tok||''); SPOT.ref=String(s0.ref||''); SPOT.exp=+s0.exp||0; }catch(e){}
const spotSave=()=>{ try{ localStorage.setItem('prism-spotify',JSON.stringify({id:SPOT.id,tok:SPOT.tok,ref:SPOT.ref,exp:SPOT.exp})); }catch(e){} };
const spotRedirect=()=>location.origin+location.pathname;
function spotOn(){ return !!SPOT.title&&(kind==='mic'||kind==='tab'); }
function spotFrac(){
  if(!spotOn()||!SPOT.playing||!SPOT.dur) return null;
  return Math.max(0,Math.min(1,(SPOT.prog+(performance.now()-SPOT.at))/SPOT.dur));
}
function spotUi(text){
  const on=!!(SPOT.tok||SPOT.ref);
  $('bSp').textContent=on?'Disconnect':'Connect'; $('bSp').setAttribute('aria-pressed',String(on)); $('spId').disabled=on;
  if($('spId').value!==SPOT.id&&document.activeElement!==$('spId')) $('spId').value=SPOT.id;
  $('spMsg').textContent=text!==undefined?text:(on?(SPOT.title?'Now playing: '+SPOT.title:'Connected. Nothing is playing on Spotify at the moment.'):'In your Spotify developer app, set the redirect address to '+spotRedirect()+' then paste its Client ID above and press Connect.');
}
function spotShow(){
  /* the readout and record label follow Spotify while the microphone or tab audio is the source */
  const cur=$('now').textContent;
  if(spotOn()){ if(cur!==SPOT.title){ if(cur!==SPOT.shown) SPOT.prev=cur; setNow(SPOT.title); SPOT.shown=SPOT.title; } }
  else{ if(SPOT.shown&&cur===SPOT.shown&&SPOT.prev) setNow(SPOT.prev); SPOT.shown=''; }
}
function spotOff(text){
  SPOT.tok=''; SPOT.ref=''; SPOT.exp=0; SPOT.title=''; SPOT.img=null; SPOT.imgUrl=''; SPOT.playing=false; spotSave();
  clearTimeout(SPOT.timer); SPOT.timer=null; spotShow(); spotUi(text);
}
async function spotToken(body){
  body.client_id=SPOT.id;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body).toString()});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token) throw new Error(j.error_description||j.error||('HTTP '+r.status));
  SPOT.tok=j.access_token; if(j.refresh_token) SPOT.ref=j.refresh_token; SPOT.exp=Date.now()+((+j.expires_in||3600)-60)*1000; spotSave();
}
async function spotPoll(){
  clearTimeout(SPOT.timer); SPOT.timer=null;
  if(!SPOT.tok&&!SPOT.ref) return;
  let next=5000;
  try{
    if(document.hidden) next=8000;
    else{
      if(!SPOT.tok||Date.now()>SPOT.exp){ if(!SPOT.ref) throw new Error('expired'); await spotToken({grant_type:'refresh_token',refresh_token:SPOT.ref}); }
      const r=await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode',{headers:{Authorization:'Bearer '+SPOT.tok}});
      if(r.status===401){ SPOT.tok=''; SPOT.exp=0; if(!SPOT.ref) throw new Error('expired'); next=300; }
      else if(r.status===429){ next=Math.min(120,Math.max(5,+r.headers.get('Retry-After')||10))*1000; }
      else if(r.status===403){ spotUi('Spotify refused the request. The account that owns the developer app needs Premium, and your account must be added to the app under User Management.'); next=30000; }
      else if(r.status===204||r.status===202){ SPOT.title=''; SPOT.playing=false; SPOT.img=null; SPOT.imgUrl=''; spotUi(); }
      else if(r.ok){
        const j=await r.json(), it=j&&j.item;
        if(it){
          const who=(it.artists||[]).map(a=>a.name).filter(Boolean).join(', ')||(it.show&&it.show.name)||'';
          SPOT.title=(it.name||'Unknown')+(who?' - '+who:''); SPOT.dur=+it.duration_ms||0; SPOT.prog=+j.progress_ms||0; SPOT.at=performance.now(); SPOT.playing=!!j.is_playing;
          const ims=(it.album&&it.album.images)||it.images||[], pic=ims.length?(ims.find(i=>i.width&&i.width<=640)||ims[0]).url:'';
          if(pic!==SPOT.imgUrl){
            SPOT.imgUrl=pic; SPOT.img=null;
            if(pic){ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{ if(SPOT.imgUrl===pic) SPOT.img=im; }; im.src=pic; }   /* loaded with permission to draw, so the screen can still be recorded */
          }
        }else{ SPOT.title=''; SPOT.playing=false; }
        spotUi();
      }
    }
  }catch(e){
    const m=String(e&&e.message||e);
    if(m==='expired'||/invalid_grant|revoked|invalid_client/i.test(m)) return spotOff('Spotify needs connecting again. Press Connect.');
    next=15000;
  }
  spotShow();
  SPOT.timer=setTimeout(spotPoll,next);
}
async function spotConnect(){
  const id=$('spId').value.trim();
  if(!/^[0-9a-zA-Z]{20,64}$/.test(id)) return spotUi('That does not look like a Client ID. It is a 32-character code on your app page at developer.spotify.com.');
  if(framed) return spotUi('Spotify can only be linked from the hosted page, not from this preview.');
  if(!(window.crypto&&crypto.subtle)) return spotUi('This browser cannot make the secure sign-in request.');
  SPOT.id=id; spotSave();
  const rnd=n=>{ const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a,b=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[b%62]).join(''); };
  const ver=rnd(64), state=rnd(16), dig=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  const chal=btoa(String.fromCharCode.apply(null,dig)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  try{ localStorage.setItem('prism-spotify-pkce',JSON.stringify({v:ver,s:state})); }catch(e){ return spotUi('This browser is blocking storage, which the sign-in needs.'); }
  location.assign('https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:id,scope:'user-read-currently-playing user-read-playback-state',code_challenge_method:'S256',code_challenge:chal,redirect_uri:spotRedirect(),state:state}).toString());
}
$('bSp').onclick=()=>{ (SPOT.tok||SPOT.ref)?spotOff():spotConnect(); };
$('spId').addEventListener('keydown',e=>e.stopPropagation());
(async()=>{
  /* coming back from the Spotify sign-in page */
  const q=new URLSearchParams(location.search), code=q.get('code'), err=q.get('error'), state=q.get('state');
  let pk=null; try{ pk=JSON.parse(localStorage.getItem('prism-spotify-pkce')||'null'); }catch(e){}
  if((code||err)&&pk&&state===pk.s){
    try{ localStorage.removeItem('prism-spotify-pkce'); history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
    setTimeout(()=>setFold($('bFoldSp'),true),0);
    if(err){ spotUi(err==='access_denied'?'Spotify sign-in was cancelled.':'Spotify sign-in failed: '+err); return; }
    try{ await spotToken({grant_type:'authorization_code',code:code,redirect_uri:spotRedirect(),code_verifier:pk.v}); spotUi('Connected.'); }
    catch(e){ spotOff('Spotify sign-in failed: '+String(e&&e.message||e)); return; }
  }else spotUi();
  spotPoll();
})();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&(SPOT.tok||SPOT.ref)) spotPoll(); });

function setFold(btn,open){
  btn.setAttribute('aria-expanded',String(open));
  const body=$(btn.getAttribute('aria-controls')); if(body) body.hidden=!open;
}
document.querySelectorAll('.fold').forEach(btn=>{
  const k=btn.dataset.fold;
  if(k in folds) setFold(btn,!!folds[k]);
  btn.onclick=()=>{
    const open=btn.getAttribute('aria-expanded')!=='true';
    setFold(btn,open); folds[k]=open;
    try{ localStorage.setItem('prism-folds',JSON.stringify(folds)); }catch(e){}
  };
});

  bMic:'Listens through the microphone, or a connected line-in, and draws whatever it hears.',
  bTab:'On a computer, shares the sound from another browser tab so the visuals follow it.',
  bDemo:'Plays a built-in beat so you can try the visuals without any music. Press again to stop.',
  bDemoPrev:'Switches to the previous built-in beat.',
  bDemoNext:'Switches to the next built-in beat.',
  bPrev:'Goes back to the previous track you chose.',
  bPlay:'Pauses the track, or starts it again.',
  bNext:'Skips to the next track you chose.',
  bMicAuto:'Turns quiet sound up automatically so the visuals stay lively. Switch it off to set the level yourself with the slider.',
  bFavAdd:'Saves the screen style, display mode and colour you are looking at, so you can come back to it with one tap.',
  bFavDel:'Removes the look you are on from your favourites.',
  bFold:'Shows or hides the beat and auto-change settings.',
  bFoldFav:'Shows or hides your saved favourite looks.',
  bFoldGain:'Shows or hides the gain slider, which sets how strongly the visuals react.',
  bFoldScreen:'Shows or hides the screen controls, such as full screen, lock and the mini player.',
  bAutoEvery:'Sets how often Auto switches to a new look. Each press moves to the next choice.',
  bAutoFrom:'Chooses whether Auto picks from every look or only from your favourites.',
  bAuto:'When lit, the look changes by itself as the music plays.',
  bGrid:'Shows or hides the measuring grid on the retro screen.',
  bPip:'Pops the visuals out into a small floating window that stays on top of other apps.',
  bFull:'Hides all the controls so the visuals fill the screen. Tap the screen to bring them back.',
  bLock:'Freezes the current look and hides the controls. Taps are ignored until you hold the screen for two seconds.',
  bRec:'Records up to 15 seconds of the visuals as a video you can save or share.',
  bRecDel:'Throws away the clip you just recorded.',
  bSmooth:'Switches the Scope and X-Y traces between the raw, jagged signal and a soft, flowing line.',
  bPic:'Lets you choose a picture from this device. The Picture modes then bend and reshape it in time with the music.',
  bPicReset:'Goes back to the built-in picture.',
  bSp:'Links Prism to your Spotify account so it can show the track that is playing, put its cover on the record and move the tonearm with the song. It cannot hear Spotify, so keep the microphone on.',
  bMdl:'Lets you choose a 3D model from this device. It must be a single .glb file. The model then spins, swells and twists in time with the music.',
  bMdlReset:'Goes back to the built-in 3D shape.',
  bClicks:'Turns the clicking sounds of the keys and sliders on or off.'
};
let tipTimer=null, tipFor=null, tipShown=null;
function tipHide(){ clearTimeout(tipTimer); tipTimer=null; tipFor=null; $('tip').hidden=true; }
function tipShow(btn){
  const tip=$('tip'), r=btn.getBoundingClientRect();
  tip.textContent=HELP[btn.id]; tip.hidden=false; tipShown=btn; clearTimeout(hideTimer);
  const tw=tip.offsetWidth, th=tip.offsetHeight, vw=document.documentElement.clientWidth;
  /* sit well above the key so a finger resting on it does not cover the words */
  let top=r.top-th-34; if(top<8) top=Math.min(8,r.bottom+34);
  tip.style.left=Math.max(8,Math.min(vw-tw-8,r.left+r.width/2-tw/2))+'px';
  tip.style.top=Math.max(8,top)+'px';
}
document.addEventListener('pointerdown',e=>{
  const btn=e.target&&e.target.closest?e.target.closest('button'):null;
  tipHide(); tipShown=null;
  if(!btn||!HELP[btn.id]) return;
  tipFor=btn; tipTimer=setTimeout(()=>{ if(tipFor===btn) tipShow(btn); },5000);
},true);
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{ const was=!$('tip').hidden; tipHide(); if(was) showUI(); },true));
document.addEventListener('pointermove',e=>{
  if(!tipFor) return;
  const r=tipFor.getBoundingClientRect();
  if(e.clientX<r.left-12||e.clientX>r.right+12||e.clientY<r.top-12||e.clientY>r.bottom+12){ const was=!$('tip').hidden; tipHide(); if(was) showUI(); }
},true);
/* letting go after reading the pop-up must not also press the key */
document.addEventListener('click',e=>{
  if(tipShown&&e.target&&e.target.closest&&e.target.closest('button')===tipShown){ e.stopImmediatePropagation(); e.preventDefault(); }
  tipShown=null;
},true);
document.addEventListener('contextmenu',e=>{ if(e.target&&e.target.closest&&e.target.closest('button')) e.preventDefault(); });

function setStyle(name,preset){
  if(!STYLES[name]) name='retro';
  const cur=MODES[mode]&&MODES[mode][0], st=STYLES[name];
  style=name; document.body.dataset.style=name;
  BGC=st.bg; BGH='rgb('+st.bg+')'; MONO=!!st.mono;
  for(const k in BUF){ BUF[k].c.width=BUF[k].c.height=1; BUF[k].fresh=true; BUF[k].key=''; }
  MODES=(st.sig?[st.sig]:[]).concat(GENERIC); buildModes();
  $('bGrid').hidden=name!=='retro'; $('palGrp').hidden=!!st.noPal;
  document.querySelectorAll('#styles button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===name)));
  if(preset&&st.pal) setPal(st.pal);
  setMode(Math.max(0,MODES.findIndex(m=>m[0]===(preset?st.mode:cur))));
  try{ localStorage.setItem('prism-style',name); }catch(e){}
}
Object.keys(STYLES).forEach(k=>{
  const b=document.createElement('button'); b.type='button'; b.dataset.k=k; b.textContent=STYLES[k].name;
  b.onclick=()=>setStyle(k,true); $('styles').appendChild(b);
});

try{ savedStyle=localStorage.getItem('prism-style')||'retro'; }catch(e){}

  if(document.getElementById('webfonts')) return;
  const l=document.createElement('link'); l.id='webfonts'; l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap'; document.head.appendChild(l);
}
try{

  else webFonts();
